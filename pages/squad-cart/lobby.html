<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahead — Squad Cart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lobby.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

  <!-- Ambient Background -->
  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>
  <div class="ambient-orb orb-3"></div>
  <div class="noise-overlay"></div>
  <canvas id="smoke-canvas"></canvas>

  <div class="split-layout">
    <!-- Left Side: Branding -->
    <aside class="branding-panel reveal-up active">
      <header>
        <a href="../../index.html" class="logo" style="text-decoration: none; color: inherit;">
          <span class="mark">A</span> Ahead
        </a>
      </header>
      
      <div class="branding-content">
        <h1 class="typing-effect">Order together. <br>Eat together.</h1>
        <p>No more awkward bill splitting. Create a squad cart, add your own items, and place one massive order.</p>
        
        <div class="floating-widgets">
          <div class="widget float-1">
            <div class="widget-icon" style="background: rgba(181, 230, 169, 0.2); color: #1d6f4f;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            </div>
            <div class="widget-text">
              <strong>Squad Goals</strong>
              <span>Multiplayer ordering</span>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Right Side: Forms -->
    <main class="forms-panel reveal-up active delay-1">
      <div class="login-card" id="form-container">
        
        <div class="login-header">
          <h2>Squad Cart Lobby</h2>
          <p>Create a new squad or join your friends.</p>
        </div>
        
        <button id="create-squad-btn" class="btn btn-primary" style="margin-bottom: 24px;">
          Create New Squad Session
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>

        <div class="divider"><span>OR</span></div>

        <form id="join-form">
          <div class="form-group">
            <label for="squad-code">Have a code?</label>
            <input type="text" id="squad-code" name="code" placeholder="e.g. A-1234" required autocomplete="off" style="text-transform: uppercase;">
          </div>
          <div id="join-error" class="error-message" hidden>Invalid or expired squad code.</div>
          <button type="submit" id="join-button" class="btn btn-secondary">
            Join Squad
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </form>

      </div>
    </main>
  </div>

  <script src="../../index.js"></script>
  <script src="../queue-engine/supabase-config.js" type="module"></script>
  <script src="lobby.js" type="module"></script>
</body>
</html>
